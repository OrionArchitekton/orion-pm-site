version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react-runtime:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite-build:
        patterns: ["vite", "@vitejs/plugin-react"]
      tailwind-build:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      routine:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
